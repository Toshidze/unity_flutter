<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Unity WebGL Games</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #111;
            color: #eee;
            text-align: center;
            padding: 2rem;
            margin: 0;
        }

        h1 {
            font-size: clamp(1.8rem, 5vw, 3rem);
            margin-bottom: 2rem;
        }

        a {
            display: block;
            font-size: clamp(1.2rem, 4vw, 1.8rem);

            padding: 1rem;
            margin: 0.8rem auto;
            border-radius: 0.75rem;
            max-width: 300px;
            transition: background 0.2s;
        }

        a:hover {
            background: #0056b3;
        }

</head>

<body>
    <h1>🎮 Unity WebGL Games</h1>
